data:
  data_path: "datasets/elliptic/elliptic_data.pt"
  weights_only: false

runtime:
  # Option 1 (recommended): set gpu_id in [0,1,2,3] -> device becomes cuda:{gpu_id}
  gpu_id: 0
  available_cuda_ids: [0, 1, 2, 3]
  # Option 2: set explicit device string (used when gpu_id is null)
  device: "cuda:0"

experiment:
  # baseline | xavier_only | graphnorm_xavier
  setting: "baseline"
  presets:
    baseline:
      graphnorm: false
      init_mode: "default"
      results_root: "results"
      checkpoint_root: "checkpoints"
    xavier_only:
      graphnorm: false
      init_mode: "xavier"
      results_root: "results_no_graphnorm"
      checkpoint_root: "checkpoints_no_graphnorm"
    graphnorm_xavier:
      graphnorm: true
      init_mode: "xavier"
      results_root: "results_with_graphnorm"
      checkpoint_root: "checkpoints_with_graphnorm"

training:
  seed: 42
  fold: 5
  ratio: [0.8, 0.1, 0.1] # train, val, test
  batch_size: 128
  pretrain_epochs: 50
  finetune_epochs: 100
  epochs: 1024
  patience: 64
  n_trials: 100

# Backward compatibility (runtime.device is preferred)
device: "cuda:0"

optimizer:
  type: adam
  lr: 0.004
  weight_decay: 0.0005
  momentum: 0.9

dataset:
  type: elliptic
  kwargs: {}
